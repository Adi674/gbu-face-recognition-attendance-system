# Azure DevOps Pipeline for Face Recognition System (Using Existing Database)
trigger:
- main
- develop

variables:
  # Build Variables
  pythonVersion: '3.12'
  vmImageName: 'ubuntu-latest'
  
  # Azure Variables (Set these in Azure DevOps Variable Groups)
  azureServiceConnection: 'azure-service-connection'
  webAppName: 'face-recognition-app-$(Build.BuildId)'
  resourceGroupName: 'face-recognition-rg'
  location: 'East US'

stages:
- stage: Build
  displayName: Build and Test
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)

    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(pythonVersion)'
      displayName: 'Use Python $(pythonVersion)'

    - script: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      displayName: 'Install dependencies'

    - script: |
        # Run basic tests if you have any
        python -m pytest tests/ --tb=short --strict-markers || echo "No tests found, skipping..."
        
        # Basic syntax check
        python -m py_compile fastapi_auth/app/main.py
        python -m py_compile face_recognition_system/pipeline.py
        python -m py_compile run.py
      displayName: 'Run tests and syntax check'

    - task: ArchiveFiles@2
      displayName: 'Archive application'
      inputs:
        rootFolderOrFile: '$(System.DefaultWorkingDirectory)'
        includeRootFolder: false
        archiveType: zip
        archiveFile: $(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip
        replaceExistingArchive: true

    - upload: $(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip
      artifact: drop

- stage: DeployInfrastructure
  displayName: Deploy App Service Only
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: DeployInfra
    displayName: Deploy Azure App Service
    pool:
      vmImage: $(vmImageName)
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: drop

          - task: AzureCLI@2
            displayName: 'Create Resource Group'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az group create --name $(resourceGroupName) --location "$(location)"

          - task: AzureCLI@2
            displayName: 'Create App Service Plan'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az appservice plan create \
                  --name "$(webAppName)-plan" \
                  --resource-group $(resourceGroupName) \
                  --sku B1 \
                  --is-linux \
                  --location "$(location)"

          - task: AzureCLI@2
            displayName: 'Create Web App'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az webapp create \
                  --name $(webAppName) \
                  --resource-group $(resourceGroupName) \
                  --plan "$(webAppName)-plan" \
                  --runtime "PYTHON|3.12" \
                  --startup-file "python run.py"

          - task: AzureCLI@2
            displayName: 'Configure Web App Settings'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az webapp config appsettings set \
                  --name $(webAppName) \
                  --resource-group $(resourceGroupName) \
                  --settings \
                    DATABASE_URL="$(databaseUrl)" \
                    SECRET_KEY="$(secretKey)" \
                    PINECONE_API_KEY="$(pineconeApiKey)" \
                    PINECONE_ENVIRONMENT="$(pineconeEnvironment)" \
                    PINECONE_INDEX_NAME="face-recognition" \
                    ENV="production" \
                    PORT="8000" \
                    ACCESS_TOKEN_EXPIRE_MINUTES="30" \
                    SCM_DO_BUILD_DURING_DEPLOYMENT="true" \
                    PYTHON_VERSION="3.12"

- stage: Deploy
  displayName: Deploy Application
  dependsOn: 
  - Build
  - DeployInfrastructure
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: Deploy
    displayName: Deploy to Azure Web App
    pool:
      vmImage: $(vmImageName)
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: drop

          - task: AzureWebApp@1
            displayName: 'Deploy Azure Web App'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              appType: 'webAppLinux'
              appName: '$(webAppName)'
              package: '$(Pipeline.Workspace)/drop/$(Build.BuildId).zip'
              runtimeStack: 'PYTHON|3.12'
              startUpCommand: 'python run.py'

- stage: PostDeployment
  displayName: Post Deployment Tasks
  dependsOn: Deploy
  condition: succeeded()
  jobs:
  - job: HealthCheck
    displayName: Application Health Check
    pool:
      vmImage: $(vmImageName)
    steps:
    - script: |
        echo "Waiting for application to start..."
        sleep 30
        
        echo "Performing health check on deployed application..."
        # Get the app URL
        APP_URL="https://$(webAppName).azurewebsites.net"
        echo "Checking: $APP_URL/health"
        
        # Health check with retry
        for i in {1..5}; do
          if curl -f "$APP_URL/health"; then
            echo "✅ Health check passed!"
            exit 0
          else
            echo "❌ Health check failed. Attempt $i/5"
            sleep 10
          fi
        done
        
        echo "❌ Health check failed after 5 attempts"
        exit 1
      displayName: 'Application Health Check'

    - script: |
        echo "🎉 Deployment Summary:"
        echo "App URL: https://$(webAppName).azurewebsites.net"
        echo "Health Check: https://$(webAppName).azurewebsites.net/health"
        echo "API Docs: https://$(webAppName).azurewebsites.net/docs"
        echo "Database: Using existing Supabase database"
        echo "Face Recognition: Enabled with Pinecone"
      displayName: 'Deployment Summary'
